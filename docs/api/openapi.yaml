openapi: 3.1.0
info:
  title: 校园轻活动 AI DIY 工坊 API
  version: 1.0.0
  description: |
    V1 核心 REST API 契约。所有组织者业务接口使用 Bearer JWT；
    公共活动读取和表单提交接口无需组织者登录。
    页面内容统一使用 PageDocument，AI 只返回 Proposal，用户确认后才能应用。
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: 本地后端（Spring Boot，server/）
  - url: http://127.0.0.1:8000/api/v1
    description: 本地智能体（FastAPI，agent/）
  - url: https://api.example.com/api/v1
    description: Production
tags:
  - name: Auth
  - name: Templates
  - name: Projects
  - name: Draft
  - name: Versions
  - name: Publishing
  - name: Public Activities
  - name: Submissions
  - name: AI

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: 注册
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/Error"

  /auth/login:
    post:
      tags: [Auth]
      summary: 登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/Error"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新访问令牌
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/Error"

  /auth/me:
    get:
      tags: [Auth]
      summary: 当前用户
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"

  /templates:
    get:
      tags: [Templates]
      summary: 模板列表
      operationId: listTemplates
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [recruitment, registration, vote, checkin]
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Template"
        default:
          $ref: "#/components/responses/Error"

  /projects:
    get:
      tags: [Projects]
      summary: 项目列表
      operationId: listProjects
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProjectStatus"
        - name: q
          in: query
          description: 标题/描述模糊搜索
          schema:
            type: string
        - name: activityType
          in: query
          description: 按活动类型筛选（社团招新 / 讲座报名 / 活动签到 …）
          schema:
            type: string
        - name: sort
          in: query
          description: 排序字段，例如 updatedAt、创建时间倒序
          schema:
            type: string
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Projects]
      summary: 创建项目
      operationId: createProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 160
                description:
                  type: [string, "null"]
                  maxLength: 2000
                templateId:
                  type: [string, "null"]
                  format: uuid
                initialDocument:
                  oneOf:
                    - $ref: "#/components/schemas/PageDocument"
                    - type: "null"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: 项目详情
      operationId: getProject
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Projects]
      summary: 修改项目标题或描述
      operationId: updateProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 160
                description:
                  type: [string, "null"]
                  maxLength: 2000
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Projects]
      summary: 软删除项目
      operationId: deleteProject
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"

  /projects/{projectId}/duplicate:
    post:
      tags: [Projects]
      summary: 复制项目
      operationId: duplicateProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 160
      responses:
        "201":
          description: Duplicated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"

  /projects/{projectId}/draft:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Draft]
      summary: 获取当前草稿
      operationId: getDraft
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [revision, document, updatedAt]
                    properties:
                      revision:
                        type: integer
                        minimum: 0
                      document:
                        $ref: "#/components/schemas/PageDocument"
                      updatedAt:
                        type: string
                        format: date-time
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [Draft]
      summary: 覆盖保存草稿
      operationId: saveDraft
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseRevision, document]
              properties:
                baseRevision:
                  type: integer
                  minimum: 0
                document:
                  $ref: "#/components/schemas/PageDocument"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [revision, savedAt]
                    properties:
                      revision:
                        type: integer
                      savedAt:
                        type: string
                        format: date-time
        "409":
          description: Revision conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Draft]
      summary: 局部更新草稿（JSON Merge Patch 扩展）
      description: |
        只传要改的部分，不用回传整份文档。

        合并规则：
        - 对象：逐键递归合并，patch 里显式 `null` 表示删掉该键；
        - 两侧都是「带 id 的对象数组」（如 `pages`、`blocks`）：**按 id 合并**，
          patch 里出现的 id 逐字段合并、没出现的元素原样保留，
          带 `"_deleted": true` 的元素被移除；
        - 其余数组：整体替换。

        合并完仍会过一遍 PageDocument schema 校验，所以 patch 写不坏文档。

        示例：只改首页名字
        ```json
        { "baseRevision": 3, "patch": { "pages": [ { "id": "pg-xxx", "name": "新的首页" } ] } }
        ```
      operationId: patchDraft
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patch]
              properties:
                baseRevision:
                  type: [integer, "null"]
                  minimum: 0
                  description: 不给则用服务端当前版本，给了不一致会返回 409
                patch:
                  type: object
                  description: 要合并进文档的对象
      responses:
        "200":
          description: Patched
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [revision, savedAt]
                    properties:
                      revision:
                        type: integer
                      savedAt:
                        type: string
                        format: date-time
        "409":
          description: Revision conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: 合并后的文档不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /projects/{projectId}/versions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Versions]
      summary: 版本列表
      operationId: listVersions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PageVersionSummary"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Versions]
      summary: 将当前草稿保存为不可变版本
      operationId: createVersion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseRevision]
              properties:
                baseRevision:
                  type: integer
                  minimum: 0
                source:
                  type: string
                  enum: [manual, ai]
                  default: manual
      responses:
        "201":
          description: Version created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PageVersionSummary"
        default:
          $ref: "#/components/responses/Error"

  /projects/{projectId}/publish:
    post:
      tags: [Publishing]
      summary: 发布指定版本
      operationId: publishProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionId]
              properties:
                versionId:
                  type: string
                  format: uuid
                slug:
                  type: [string, "null"]
                  pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
                  minLength: 3
                  maxLength: 80
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PublishResult"
        default:
          $ref: "#/components/responses/Error"

  /projects/{projectId}/unpublish:
    post:
      tags: [Publishing]
      summary: 下线活动
      operationId: unpublishProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Unpublished
        default:
          $ref: "#/components/responses/Error"

  /public/activities:
    get:
      tags: [Public Activities]
      summary: 公开活动列表（匿名可访问）
      description: |
        移动端首页/发现页的数据源，只返回已发布活动，字段走白名单
        （**不含 draftDocument / ownerId**）。
      operationId: listPublicActivities
      parameters:
        - name: q
          in: query
          description: 标题/描述模糊搜索
          schema:
            type: string
        - name: activityType
          in: query
          description: 按活动类型筛选
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Published activities
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicActivitySummary"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        default:
          $ref: "#/components/responses/Error"

  /public/activities/{slug}:
    get:
      tags: [Public Activities]
      summary: 获取已发布活动
      operationId: getPublicActivity
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Published activity
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [slug, title, document, status]
                    properties:
                      slug:
                        type: string
                      title:
                        type: string
                      status:
                        type: string
                        enum: [published, closed, full, unpublished]
                      document:
                        $ref: "#/components/schemas/PageDocument"
                      publishSettings:
                        $ref: "#/components/schemas/PublishSettings"
                      activityType:
                        type: [string, "null"]
                      coverTone:
                        type: [string, "null"]
                      coverCode:
                        type: [string, "null"]
                      coverTitle:
                        type: [string, "null"]
        "404":
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /public/activities/{slug}/submissions:
    post:
      tags: [Public Activities]
      summary: 提交活动表单
      operationId: createSubmission
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pageId, formComponentId, answers]
              properties:
                pageId:
                  type: string
                  maxLength: 80
                formComponentId:
                  type: string
                  maxLength: 80
                answers:
                  type: object
                  additionalProperties: true
                idempotencyKey:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [submissionId, status]
                    properties:
                      submissionId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [valid]
                      submittedAt:
                        type: string
                        format: date-time
        "409":
          description: Activity closed, full, or duplicate submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Form validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /projects/{projectId}/submissions:
    get:
      tags: [Submissions]
      summary: 组织者查看提交列表
      operationId: listSubmissions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [valid, invalid]
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Submission"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        default:
          $ref: "#/components/responses/Error"

  /projects/{projectId}/analytics/summary:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Submissions]
      summary: 数据看板汇总
      operationId: getAnalyticsSummary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AnalyticsSummary"
        default:
          $ref: "#/components/responses/Error"

  /projects/{projectId}/analytics/events:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Submissions]
      summary: 行为事件明细（分页）
      operationId: listAnalyticsEvents
      security:
        - bearerAuth: []
      parameters:
        - name: eventType
          in: query
          description: 例如 public_page_view、submission_succeeded、form_started
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActivityEvent"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        default:
          $ref: "#/components/responses/Error"

  /assets:
    post:
      tags: [Projects]
      summary: 上传图片/附件
      description: |
        返回的 `url` 是**绝对地址**（如 `http://127.0.0.1:8080/api/v1/files/assets/<uid>/<file>.png`），
        前端可以直接塞进 `<img src>`，不会因为跨端口打到 5173 上而 404。
      operationId: uploadAsset
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [assetId, objectKey, url, mimeType, sizeBytes]
                    properties:
                      assetId:
                        type: string
                        format: uuid
                      objectKey:
                        type: string
                      url:
                        type: string
                        format: uri
                      mimeType:
                        type: string
                      sizeBytes:
                        type: integer
        default:
          $ref: "#/components/responses/Error"

  /files/{objectKey}:
    get:
      tags: [Projects]
      summary: 读取已上传文件（匿名可访问）
      operationId: readFile
      parameters:
        - name: objectKey
          in: path
          required: true
          description: 形如 assets/<uid>/<file>.png，**允许包含斜杠**
          schema:
            type: string
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: 文件不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{projectId}/exports:
    post:
      tags: [Submissions]
      summary: 创建 CSV 导出任务
      operationId: createExport
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [valid, invalid]
                submittedAfter:
                  type: string
                  format: date-time
                submittedBefore:
                  type: string
                  format: date-time
      responses:
        "202":
          description: Export queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [exportId, status]
                    properties:
                      exportId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [queued]
        default:
          $ref: "#/components/responses/Error"

  /exports/{exportId}:
    get:
      tags: [Submissions]
      summary: 查询导出任务
      operationId: getExport
      security:
        - bearerAuth: []
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Export status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [exportId, status]
                    properties:
                      exportId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [queued, running, succeeded, failed, expired]
                      downloadUrl:
                        type: [string, "null"]
                        format: uri
                      expiresAt:
                        type: [string, "null"]
                        format: date-time
        default:
          $ref: "#/components/responses/Error"

  /ai/jobs:
    post:
      tags: [AI]
      summary: 创建 AI 任务
      operationId: createAiJob
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAiJobRequest"
      responses:
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [jobId, status]
                    properties:
                      jobId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [queued]
        default:
          $ref: "#/components/responses/Error"

  /ai/jobs/{jobId}:
    get:
      tags: [AI]
      summary: 查询 AI 任务
      operationId: getAiJob
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: AI job
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AiJob"
        default:
          $ref: "#/components/responses/Error"

  /ai/proposals/{proposalId}/apply:
    post:
      tags: [AI]
      summary: 应用 AI 提案
      operationId: applyAiProposal
      security:
        - bearerAuth: []
      parameters:
        - name: proposalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseRevision]
              properties:
                baseRevision:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [revision, document]
                    properties:
                      revision:
                        type: integer
                      document:
                        $ref: "#/components/schemas/PageDocument"
        "409":
          description: Proposal is stale or project changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 80

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        requestId:
          type: string

    User:
      type: object
      required: [id, email, displayName, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        status:
          type: string
          enum: [active, disabled]

    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 80

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accessToken, refreshToken, user]
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            user:
              $ref: "#/components/schemas/User"

    Template:
      type: object
      required: [id, code, name, category]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [recruitment, registration, vote, checkin]
        coverUrl:
          type: [string, "null"]
          format: uri
        document:
          $ref: "#/components/schemas/PageDocument"

    ProjectStatus:
      type: string
      enum: [draft, published, unpublished, archived]

    Project:
      type: object
      required:
        - id
        - title
        - status
        - draftRevision
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        activityType:
          type: [string, "null"]
          description: 活动类型，未指定时由模板推导
        coverTone:
          type: [string, "null"]
          description: 封面色调 photo / music / vote / checkin
        coverCode:
          type: [string, "null"]
          description: 封面角标代号
        coverTitle:
          type: [string, "null"]
          description: 封面标题，最多 160 字
        status:
          $ref: "#/components/schemas/ProjectStatus"
        draftRevision:
          type: integer
        publicSlug:
          type: [string, "null"]
        publicUrl:
          type: [string, "null"]
          format: uri
        publishedVersionId:
          type: [string, "null"]
          format: uuid
        submissionCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        draftDocument:
          oneOf:
            - $ref: "#/components/schemas/PageDocument"
            - type: "null"
          description: >
            完整草稿文档。列表接口也会返回，体积较大；
            前端进编辑器后才需要，其余场景可忽略。
    PublicActivitySummary:
      type: object
      description: |
        公开列表用的精简活动信息。**刻意不含 draftDocument / ownerId**，
        避免未发布的内容被匿名请求拿到。
      required: [slug, title, status, updatedAt]
      properties:
        slug:
          type: string
        title:
          type: string
        description:
          type: [string, "null"]
        activityType:
          type: [string, "null"]
        coverTone:
          type: [string, "null"]
        coverCode:
          type: [string, "null"]
        coverTitle:
          type: [string, "null"]
        status:
          type: string
        updatedAt:
          type: string
          format: date-time

    AnalyticsSummary:
      type: object
      required:
        - submissions
        - validSubmissions
        - pageViews
        - publishedPages
        - byDay
        - byEventType
        - formStarted
        - conversionRate
      properties:
        submissions:
          type: integer
        validSubmissions:
          type: integer
        pageViews:
          type: integer
        publishedPages:
          type: integer
        byDay:
          type: array
          description: 按天聚合的提交与浏览，两条线合并到同一张表
          items:
            type: object
            properties:
              date:
                type: string
              submissions:
                type: integer
              views:
                type: integer
              count:
                type: integer
                description: submissions 的兼容别名
        byEventType:
          type: object
          additionalProperties:
            type: integer
          description: 各事件类型的计数，例如 public_page_view / submission_succeeded
        formStarted:
          type: integer
        conversionRate:
          type: number
          description: validSubmissions / formStarted，formStarted 为 0 时是 0

    ActivityEvent:
      type: object
      required: [id, eventType, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        pageId:
          type: [string, "null"]
        metadata:
          description: 事件附加信息
        occurredAt:
          type: string
          format: date-time

    Theme:
      type: object
      required: [primaryColor, backgroundColor, textColor, radius, fontScale]
      properties:
        primaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        backgroundColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        textColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        radius:
          type: integer
          minimum: 0
          maximum: 32
        fontScale:
          type: number
          minimum: 0.8
          maximum: 1.4

    PageDocument:
      type: object
      description: >
        页面文档，结构与 web/src/types/editor.ts 的 Doc 一致，
        并由 server/src/main/resources/schema/page-document.schema.json 实际校验。
        顶层只要求 title 与 pages，其余字段可选。
      required: [title, pages]
      properties:
        id:
          type: string
        title:
          type: string
          maxLength: 160
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        theme:
          $ref: "#/components/schemas/Theme"
        meta:
          $ref: "#/components/schemas/DocMeta"
        pages:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/Page"
        createdAt:
          oneOf:
            - type: integer
            - type: string
        updatedAt:
          oneOf:
            - type: integer
            - type: string
        published:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/PublishInfo"

    DocMeta:
      type: object
      description: 活动元信息，全部可选。
      properties:
        org:
          type: string
        startAt:
          type: string
        place:
          type: string
        deadline:
          type: string
        capacity:
          type: integer
          minimum: 0
        contact:
          type: string

    PublishInfo:
      type: object
      required: [url, slug]
      properties:
        url:
          type: string
        slug:
          type: string
        at:
          oneOf:
            - type: integer
            - type: string

    Page:
      type: object
      required: [id, blocks]
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 80
        role:
          type: string
          enum: [home, content, form, success]
        bg:
          type: string
        blocks:
          type: array
          maxItems: 80
          items:
            $ref: "#/components/schemas/PageComponent"

    PageComponent:
      type: object
      description: 页面内的一个组件（前端称 block）。
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - nav
            - banner
            - heading
            - text
            - image
            - infoCard
            - button
            - form
            - radio
            - checkbox
            - qrcode
            - divider
            - countdown
        props:
          type: object
        style:
          type: object
          properties:
            bg:
              type: string
            paddingX:
              type: number
            paddingY:
              type: number
            radius:
              type: number
            align:
              type: string
              enum: [left, center, right]
        hidden:
          type: boolean
    PageVersionSummary:
      type: object
      required: [id, versionNo, source, createdAt]
      properties:
        id:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        source:
          type: string
          enum: [manual, ai, template]
        createdAt:
          type: string
          format: date-time

    PublishSettings:
      type: object
      properties:
        opensAt:
          type: [string, "null"]
          format: date-time
        closesAt:
          type: [string, "null"]
          format: date-time
        maxSubmissions:
          type: [integer, "null"]
          minimum: 1
        allowDuplicateSubmissions:
          type: boolean
          default: false

    PublishResult:
      type: object
      required: [publicSlug, publicUrl, publishedVersionId, publishedAt]
      properties:
        publicSlug:
          type: string
        publicUrl:
          type: string
          format: uri
        publishedVersionId:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time

    Submission:
      type: object
      required: [id, pageId, formComponentId, answers, status, submittedAt]
      properties:
        id:
          type: string
          format: uuid
        pageId:
          type: string
        formComponentId:
          type: string
        answers:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [valid, invalid]
        submittedAt:
          type: string
          format: date-time

    CreateAiJobRequest:
      type: object
      required: [kind, projectId]
      properties:
        kind:
          type: string
          enum:
            - generate_from_prompt
            - generate_from_poster
            - component_suggestions
            - quality_check
        projectId:
          type: string
          format: uuid
        prompt:
          type: [string, "null"]
          maxLength: 4000
        assetIds:
          type: array
          maxItems: 3
          items:
            type: string
            format: uuid
        selectedComponentId:
          type: [string, "null"]
        selectedPageId:
          type: [string, "null"]
        baseRevision:
          type: [integer, "null"]
          minimum: 0
        clientRequestId:
          type: [string, "null"]
          maxLength: 100

    AiJob:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - generate_from_prompt
            - generate_from_poster
            - component_suggestions
            - quality_check
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/AiProposal"
        error:
          oneOf:
            - $ref: "#/components/schemas/Error"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time

    AiProposal:
      type: object
      required:
        - id
        - baseRevision
        - target
        - summary
        - operations
        - rationale
        - risk
        - status
      properties:
        id:
          type: string
          format: uuid
        baseRevision:
          type: integer
          minimum: 0
        target:
          type: object
          properties:
            pageId:
              type: [string, "null"]
            componentId:
              type: [string, "null"]
        summary:
          type: string
        candidateDocument:
          oneOf:
            - $ref: "#/components/schemas/PageDocument"
            - type: "null"
        operations:
          type: array
          items:
            type: object
            required: [tool, arguments]
            properties:
              tool:
                type: string
                enum:
                  - insert_component
                  - update_component
                  - move_component
                  - remove_component
                  - update_page
                  - apply_theme
                  - set_navigation
                  - report_issue
              arguments:
                type: object
                additionalProperties: true
        rationale:
          type: array
          items:
            type: string
        risk:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [proposed, applied, rejected, stale]

