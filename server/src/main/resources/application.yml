server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: campus-diy-server
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    default-property-inclusion: non_null
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:campus_diy}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USER:campus_app}
    password: ${DB_PASSWORD:Campus_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 8000
      pool-name: campus-pool
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.campus.server.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

# ---------------------------------------------------------------- 应用配置
app:
  # 前端开发服务器地址，用于 Cookie 与 CORS
  web-origin: ${WEB_ORIGIN:http://localhost:5173}
  # 对外可访问的公开活动地址前缀（发布后拼成 publicUrl）
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173/p}
  # 智能体服务地址：后端调用它，前端不要直连
  agent-base-url: ${AGENT_BASE_URL:http://127.0.0.1:8000}
  agent-timeout-seconds: 90
  jwt:
    # 生产必须通过环境变量覆盖，至少 32 字节
    secret: ${JWT_SECRET:campus-diy-dev-secret-please-change-this-32bytes}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  upload:
    max-mb: ${UPLOAD_MAX_MB:10}
    # 本地开发用磁盘兜底，生产替换为阿里云 OSS
    dir: ${UPLOAD_DIR:./uploads}

logging:
  level:
    root: info
    com.campus.server: debug
    com.campus.server.mapper: info
